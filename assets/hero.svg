<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Job Harvester</title>
  <desc id="description">A local job search tool for backend, applied AI and distributed systems. Collect, screen and browse with Python, SQLite and an HTML report.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101e39"/><stop offset="1" stop-color="#20385c"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#93c5fd"/><stop offset="1" stop-color="#6ee7b7"/></linearGradient>
  </defs>
  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <circle cx="1110" cy="0" r="230" fill="#60a5fa" opacity=".06"/>
  <circle cx="1000" cy="290" r="145" fill="#6ee7b7" opacity=".04"/>
  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <rect x="48" y="43" width="32" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="92" y="51" fill="#b9cce6" font-size="13" font-weight="650" letter-spacing="2.3">LOCAL JOB SEARCH, LESS NOISE</text>
    <text x="48" y="127" fill="#fff" font-size="60" font-weight="750" letter-spacing="-2">Job Harvester</text>
    <text x="50" y="170" fill="#c5d3e7" font-size="23">Backend. Applied AI. Distributed systems.</text>
    <g font-size="14" font-weight="600" text-anchor="middle">
      <rect x="50" y="218" width="132" height="39" rx="19.5" fill="#fff" fill-opacity=".08" stroke="#758daa" stroke-opacity=".4"/>
      <text x="116" y="243" fill="#e1ebf8">Python stdlib</text>
      <rect x="194" y="218" width="130" height="39" rx="19.5" fill="#fff" fill-opacity=".08" stroke="#758daa" stroke-opacity=".4"/>
      <text x="259" y="243" fill="#e1ebf8">No API keys</text>
      <rect x="336" y="218" width="129" height="39" rx="19.5" fill="#fff" fill-opacity=".08" stroke="#758daa" stroke-opacity=".4"/>
      <text x="400.5" y="243" fill="#e1ebf8">Runs locally</text>
    </g>
    <g transform="translate(730 58)">
      <rect width="416" height="202" rx="14" fill="#0d182b" stroke="#506887" stroke-opacity=".6"/>
      <circle cx="23" cy="22" r="4" fill="#6480a3"/><circle cx="38" cy="22" r="4" fill="#6480a3"/><circle cx="53" cy="22" r="4" fill="#6480a3"/>
      <text x="393" y="27" text-anchor="end" fill="#91a7c6" font-size="11" letter-spacing="1.5">YOUR SEARCH, YOUR MACHINE</text>
      <path d="M39 63v83" stroke="#38516f" stroke-width="2"/>
      <g fill="#6ee7b7"><circle cx="39" cy="65" r="6"/><circle cx="39" cy="106" r="6"/><circle cx="39" cy="147" r="6"/></g>
      <g fill="#e6effb" font-size="17" font-weight="600"><text x="61" y="71">Collect</text><text x="61" y="112">Screen</text><text x="61" y="153">Browse</text></g>
      <g fill="#9cb2d0" font-size="14"><text x="170" y="71">Public APIs &amp; feeds</text><text x="170" y="112">Roles, experience &amp; evidence</text><text x="170" y="153">Searchable HTML report</text></g>
      <text x="25" y="185" fill="#91a7c6" font-size="12">SQLite + JSON · No server to run</text>
    </g>
  </g>
</svg>
